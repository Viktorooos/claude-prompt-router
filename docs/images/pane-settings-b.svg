idth="1"/><g transform="translate(38 209)"><rect width="34" height="34" rx="10" fill="#3fb6a0" fill-opacity=".16"/><g transform="translate(5 5)"><rect x="6" y="7" width="12" height="10" rx="2" fill="none" stroke="#3fb6a0" stroke-width="1.6"/><path d="M12 9.6v4.8M9.6 12h4.8" stroke="#3fb6a0" stroke-width="1.6" stroke-linecap="round"/></g></g><text x="86" y="223" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >New session: ask or auto</text><text x="86" y="241" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Ask: you confirm. Auto: it starts by itself</text><text x="86" y="256" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >when the chat reaches the share.</text><rect x="372" y="209" width="70" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="384" y="228" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >ask</text><path d="M422 221l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="279" width="432" height="80" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 299)"><rect width="34" height="34" rx="10" fill="#3fb6a0" fill-opacity=".16"/><g transform="translate(5 5)"><path d="M8 15.5h8l-1-1.6v-3a3 3 0 0 0-6 0v3z M11 17.5h2" fill="none" stroke="#3fb6a0" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g></g><text x="86" y="313" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Notifications</text><text x="86" y="331" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Shows a short note when the router changes</text><text x="86" y="346" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >something. Recommended: on.</text><rect x="390" y="299" width="52" height="28" rx="14" fill="#f1f4f2" /><text x="416" y="318" font-size="12.5" font-weight="600" fill="#111" text-anchor="middle" >On</text><rect x="8" y="389" width="464" height="367" rx="18" fill="#1b1f1d" stroke="#e0834a" stroke-width="1.2"/><g transform="translate(28 409)"><rect width="38" height="38" rx="10" fill="#e0834a" fill-opacity=".16"/><g transform="translate(7 7)"><path d="M7 9h10M7 15h10" stroke="#e0834a" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="9" r="1.8" fill="#1b1f1d" stroke="#e0834a" stroke-width="1.5"/><circle cx="10" cy="15" r="1.8" fill="#1b1f1d" stroke="#e0834a" stroke-width="1.5"/></g></g><text x="80" y="425" font-size="14" font-weight="600" fill="#eef2ef" text-anchor="start" >More settings</text><text x="80" y="443" font-size="11.5" font-weight="400" fill="#9aa59f" text-anchor="start" >Classifier, savings baseline, auto-open</text><rect x="24" y="465" width="432" height="95" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 485)"><rect width="34" height="34" rx="10" fill="#e0834a" fill-opacity=".16"/><g transform="translate(5 5)"><rect x="8" y="8" width="8" height="8" rx="1.5" fill="none" stroke="#e0834a" stroke-width="1.5"/><path d="M10.5 6v2M13.5 6v2M10.5 16v2M13.5 16v2M6 10.5h2M6 13.5h2M16 10.5h2M16 13.5h2" stroke="#e0834a" stroke-width="1.3" stroke-linecap="round"/></g></g><text x="86" y="499" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Decided by</text><text x="86" y="517" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >The model that reads your prompt and</text><text x="86" y="532" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >decides. Haiku is cheaper, Sonnet more</text><text x="86" y="547" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >accurate. Recommended: haiku.</text><rect x="261.4" y="485" width="180.6" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="273.4" y="504" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >haiku (recommended)</text><path d="M422 497l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="570" width="432" height="80" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 590)"><rect width="34" height="34" rx="10" fill="#e0834a" fill-opacity=".16"/><g transform="translate(5 5)"><path d="M12 6.5v11M8 17.5h8M6.5 9.5h11M6.5 9.5l-1.8 4a2.2 2.2 0 0 0 3.6 0zM17.5 9.5l-1.8 4a2.2 2.2 0 0 0 3.6 0z" fill="none" stroke="#e0834a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g></g><text x="86" y="604" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Savings compared with</text><text x="86" y="622" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >What "You saved" is measured against.</text><text x="86" y="637" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Recommended: history.</text><rect x="246.60000000000002" y="590" width="195.4" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="258.6" y="609" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >history (recommended)</text><path d="M422 602l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="660" width="432" height="80" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 680)"><rect width="34" height="34" rx="10" fill="#e0834a" fill-opacity=".16"/><g transform="translate(5 5)"><rect x="6" y="7" width="12" height="10" rx="2" fill="none" stroke="#e0834a" stroke-width="1.5"/><path d="M13.5 7v10" stroke="#e0834a" stroke-width="1.5"/></g></g><text x="86" y="694" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Open this pane on start</text><text x="86" y="712" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Opens this pane by itself when a session</text><text x="86" y="727" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >starts. Recommended: off.</text><rect x="390" y="680" width="52" height="28" rx="14" fill="#3a4240" /><text x="416" y="699" font-size="12.5" font-weight="600" fill="#9aa59f" text-anchor="middle" >Off</text></svg>