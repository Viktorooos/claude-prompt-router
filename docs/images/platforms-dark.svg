<g transform="translate(0 8)">
<rect x="20" y="10" width="1160" height="468" rx="18" fill="#17181f" stroke="#2b2c37" filter="url(#sh)"/><text x="332" y="38" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">Where, model,</text><text x="332" y="54" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">effort</text><text x="460" y="46" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">Ask or auto</text><text x="588" y="46" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">Subagent</text><text x="716" y="46" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">New session</text><text x="844" y="38" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">Pane, cache</text><text x="844" y="54" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">countdown</text><text x="972" y="46" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">Savings</text><text x="1100" y="46" font-size="12" font-weight="600" fill="#a2a6ae" text-anchor="middle">Status</text><line x1="40" x2="1160" y1="74" y2="74" stroke="#2b2c37"/><circle cx="50" cy="101" r="6" fill="#d97757"/><text x="66" y="106" font-size="16" font-weight="700" fill="#f2f3f5">Claude Code</text><text x="66" y="124" font-size="11.5" fill="#a2a6ae">mod · desktop app, CLI, VS Code</text><circle cx="332" cy="107" r="10" fill="#4cc59c" fill-opacity="0.22"/><path d="M327.8 107.3l2.8 2.9 5.6-6" fill="none" stroke="#4cc59c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="460" cy="107" r="10" fill="#4cc59c" fill-opacity="0.22"/><path d="M455.8 107.3l2.8 2.9 5.6-6" fill="none" stroke="#4cc59c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="111" font-size="12.5" fill="#f2f3f5" text-anchor="middle">Agent tool</text><text x="716" y="111" font-size="12.5" fill="#f2f3f5" text-anchor="middle">start_session</text><circle cx="844" cy="107" r="10" fill="#4cc59c" fill-opacity="0.22"/><path d="M839.8 107.3l2.8 2.9 5.6-6" fill="none" stroke="#4cc59c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="972" y="103" font-size="12.5" fill="#f2f3f5" text-anchor="middle">pane, footer,</text><text x="972" y="119" font-size="12.5" fill="#f2f3f5" text-anchor="middle">/router stats</text><circle cx="1060" cy="103" r="4" fill="#4cc59c"/><text x="1106" y="107" font-size="12.5" font-weight="600" fill="#f2f3f5" text-anchor="middle">used daily</text><line x1="40" x2="1160" y1="140" y2="140" stroke="#2b2c37"/><circle cx="50" cy="167" r="6" fill="#a9aeb6"/><text x="66" y="172" font-size="16" font-weight="700" fill="#f2f3f5">OpenCode</text><text x="66" y="190" font-size="11.5" fill="#a2a6ae">plugin · CLI / TUI, desktop</text><circle cx="332" cy="173" r="10" fill="#4cc59c" fill-opacity="0.22"/><path d="M327.8 173.3l2.8 2.9 5.6-6" fill="none" stroke="#4cc59c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="460" cy="173" r="10" fill="#4cc59c" fill-opacity="0.22"/><path d="M455.8 173.3l2.8 2.9 5.6-6" fill="none" stroke="#4cc59c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="177" font-size="12.5" fill="#f2f3f5" text-anchor="middle">task</text><text x="716" y="177" font-size="12.5" fill="#f2f3f5" text-anchor="middle">router_session</text><circle cx="844" cy="173" r="10" fill="#a9aeb6" fill-opacity="0.22"/><path d="M840.5 169.5l7 7M847.5 169.5l-7 7" stroke="#a9aeb6" stroke-width="2" stroke-linecap="round"/><text x="972" y="169" font-size="12.5" fill="#f2f3f5" text-anchor="middle">router_stats</text><text x="972" y="185" font-size="12.5" fill="#f2f3f5" text-anchor="middle">text table</text><circle cx="1040.8" cy="169" r="4" fill="#f0b545"/><text x="1106" y="173" font-size="12.5" font-weight="600" fill="#f2f3f5" text-anchor="middle">unit-tested only</text><rect x="21" y="206" width="1158" height="40" rx="0" fill="#1e1f28"/><line x1="20" x2="1180" y1="206" y2="206" stroke="#2b2c37"/><text x="44" y="231" font-size="11.5" font-weight="700" fill="#a2a6ae" letter-spacing=".08em">ORCHESTRATORS THAT RUN THE REAL claude</text><circle cx="50" cy="274" r="4.5" fill="#d97757" fill-opacity=".55"/><text x="66" y="279" font-size="15" font-weight="600" fill="#f2f3f5">Orca</text><circle cx="50" cy="314" r="4.5" fill="#d97757" fill-opacity=".55"/><text x="66" y="319" font-size="15" font-weight="600" fill="#f2f3f5">Claude Squad</text><circle cx="50" cy="354" r="4.5" fill="#d97757" fill-opacity=".55"/><text x="66" y="359" font-size="15" font-weight="600" fill="#f2f3f5">Conductor</text><circle cx="50" cy="394" r="4.5" fill="#d97757" fill-opacity=".55"/><text x="66" y="399" font-size="15" font-weight="600" fill="#f2f3f5">Crystal</text><circle cx="50" cy="434" r="4.5" fill="#d97757" fill-opacity=".55"/><text x="66" y="439" font-size="15" font-weight="600" fill="#f2f3f5">Vibe Kanban</text><rect x="272" y="258" width="888" height="192" rx="14" fill="#1e1f28" stroke="#2b2c37"/><circle cx="312" cy="332" r="10" fill="#4cc59c" fill-opacity="0.22"/><path d="M307.8 332.3l2.8 2.9 5.6-6" fill="none" stroke="#4cc59c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="337" font-size="14" font-weight="600" fill="#f2f3f5">Same as Claude Code. Each one starts the real claude CLI, so the router runs inside it unchanged.</text><text x="336" y="364" font-size="13" fill="#a2a6ae">Every decision, ask or auto, subagents and savings work as in the row above.</text><text x="336" y="386" font-size="13" fill="#a2a6ae">A new session is offered as a claude … command to run, as everywhere outside the desktop app.</text>
