<svg xmlns="http://www.w3.org/2000/svg" width="496" height="788" viewBox="0 0 496 788" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
<defs>
<filter id="sh" x="-10%" y="-12%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<linearGradient id="calm" x1="0" x2="1"><stop offset="0" stop-color="#1fa37a"/><stop offset="1" stop-color="#4cc59c"/></linearGradient>
<linearGradient id="near" x1="0" x2="1"><stop offset="0" stop-color="#d98a1c"/><stop offset="1" stop-color="#f0b545"/></linearGradient>
<linearGradient id="over" x1="0" x2="1"><stop offset="0" stop-color="#e0483f"/><stop offset="1" stop-color="#f07f4f"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc59c" stop-opacity=".28"/><stop offset="1" stop-color="#4cc59c" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121219"/><stop offset="1" stop-color="#1b1830"/></linearGradient>
</defs>
<g transform="translate(8 6)">
<rect x="8" y="8" width="464" height="367" rx="18" fill="#17181f" stroke="#2b2c37" filter="url(#sh)"/><g transform="translate(28 28)"><rect width="38" height="38" rx="10.56" fill="#4cc59c" fill-opacity="0.22"/><g transform="translate(6.33 6.33) scale(1.06)" fill="none" stroke="#4cc59c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9.5h16M12 12.5v4M10 14.5h4"/></g></g><text x="80" y="44" font-size="14" font-weight="600" fill="#f2f3f5">Session</text><text x="80" y="62" font-size="11.5" fill="#a2a6ae">50% · ask · on</text><rect x="24" y="84" width="432" height="95" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 104)"><rect width="34" height="34" rx="9.44" fill="#4cc59c" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#4cc59c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9.5h16M12 12.5v4M10 14.5h4"/></g></g><text x="86" y="118" font-size="13" font-weight="600" fill="#f2f3f5">Start a new session at</text><text x="86" y="136" font-size="10.8" fill="#a2a6ae">Once the chat fills this much of its</text><text x="86" y="151" font-size="10.8" fill="#a2a6ae">context, new work goes to a fresh session.</text><text x="86" y="166" font-size="10.8" fill="#a2a6ae">Recommended: 50%.</text><rect x="372" y="104" width="70" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="384" y="123" font-size="12.5" fill="#f2f3f5">50%</text><path d="M422 116l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="189" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 209)"><rect width="34" height="34" rx="9.44" fill="#4cc59c" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#4cc59c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9.5h16M12 12.5v4M10 14.5h4"/></g></g><text x="86" y="223" font-size="13" font-weight="600" fill="#f2f3f5">New session: ask or auto</text><text x="86" y="241" font-size="10.8" fill="#a2a6ae">Ask: you confirm. Auto: it starts by itself</text><text x="86" y="256" font-size="10.8" fill="#a2a6ae">when the chat reaches the share.</text><rect x="372" y="209" width="70" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="384" y="228" font-size="12.5" fill="#f2f3f5">ask</text><path d="M422 221l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="279" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 299)"><rect width="34" height="34" rx="9.44" fill="#4cc59c" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#4cc59c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 16v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></g><text x="86" y="313" font-size="13" font-weight="600" fill="#f2f3f5">Notifications</text><text x="86" y="331" font-size="10.8" fill="#a2a6ae">Shows a short note when the router changes</text><text x="86" y="346" font-size="10.8" fill="#a2a6ae">something. Recommended: on.</text><rect x="390" y="299" width="52" height="28" rx="14" fill="#f2f3f5"/><text x="416" y="318" font-size="12.5" font-weight="600" fill="#111216" text-anchor="middle">On</text><rect x="8" y="389" width="464" height="367" rx="18" fill="#17181f" stroke="#2b2c37" filter="url(#sh)"/><g transform="translate(28 409)"><rect width="38" height="38" rx="10.56" fill="#d97757" fill-opacity="0.22"/><g transform="translate(6.33 6.33) scale(1.06)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h9M18 8h1M5 16h3M12 16h7"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></g></g><text x="80" y="425" font-size="14" font-weight="600" fill="#f2f3f5">More settings</text><text x="80" y="443" font-size="11.5" fill="#a2a6ae">Classifier, savings baseline, auto-open</text><rect x="24" y="465" width="432" height="95" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 485)"><rect width="34" height="34" rx="9.44" fill="#d97757" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3"/></g></g><text x="86" y="499" font-size="13" font-weight="600" fill="#f2f3f5">Decided by</text><text x="86" y="517" font-size="10.8" fill="#a2a6ae">The model that reads your prompt and</text><text x="86" y="532" font-size="10.8" fill="#a2a6ae">decides. Haiku is cheaper, Sonnet more</text><text x="86" y="547" font-size="10.8" fill="#a2a6ae">accurate. Recommended: haiku.</text><rect x="365" y="485" width="77" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="377" y="504" font-size="12.5" fill="#f2f3f5">haiku</text><path d="M422 497l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="570" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 590)"><rect width="34" height="34" rx="9.44" fill="#d97757" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M8.5 19h7M5.5 8h13"/><path d="M5.5 8L3 13.5a2.5 2.5 0 0 0 5 0zM18.5 8L16 13.5a2.5 2.5 0 0 0 5 0z"/></g></g><text x="86" y="604" font-size="13" font-weight="600" fill="#f2f3f5">Savings compared with</text><text x="86" y="622" font-size="10.8" fill="#a2a6ae">What "You saved" is measured against.</text><text x="86" y="637" font-size="10.8" fill="#a2a6ae">Recommended: history.</text><rect x="350.2" y="590" width="91.8" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="362.2" y="609" font-size="12.5" fill="#f2f3f5">history</text><path d="M422 602l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="660" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 680)"><rect width="34" height="34" rx="9.44" fill="#d97757" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M14.5 5v14"/></g></g><text x="86" y="694" font-size="13" font-weight="600" fill="#f2f3f5">Open this pane on start</text><text x="86" y="712" font-size="10.8" fill="#a2a6ae">Opens this pane by itself when a session</text><text x="86" y="727" font-size="10.8" fill="#a2a6ae">starts. Recommended: off.</text><rect x="390" y="680" width="52" height="28" rx="14" fill="#24252f"/><text x="416" y="699" font-size="12.5" font-weight="600" fill="#c9ccd2" text-anchor="middle">Off</text>
</g>
</svg>
