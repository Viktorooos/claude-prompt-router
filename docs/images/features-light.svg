<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="538" viewBox="0 0 1200 538" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
<defs>
<filter id="sh" x="-10%" y="-12%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2a2357" flood-opacity="0.1"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<linearGradient id="calm" x1="0" x2="1"><stop offset="0" stop-color="#1fa37a"/><stop offset="1" stop-color="#4cc59c"/></linearGradient>
<linearGradient id="near" x1="0" x2="1"><stop offset="0" stop-color="#d98a1c"/><stop offset="1" stop-color="#f0b545"/></linearGradient>
<linearGradient id="over" x1="0" x2="1"><stop offset="0" stop-color="#e0483f"/><stop offset="1" stop-color="#f07f4f"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fa37a" stop-opacity=".28"/><stop offset="1" stop-color="#1fa37a" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2efff"/></linearGradient>
</defs>
<g transform="translate(0 8)">
<rect x="20" y="14" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(44 38)"><rect width="42" height="42" rx="11.67" fill="#6d5ce8" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#6d5ce8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/></g></g><text x="100" y="65" font-size="17" font-weight="700" fill="#1d1f23">Routes every prompt</text><text x="44" y="112" font-size="13.5" fill="#5f636b">Keep, here, a subagent or a new session,</text><text x="44" y="133" font-size="13.5" fill="#5f636b">decided before the agent starts.</text><rect x="414.67" y="14" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(438.67 38)"><rect width="42" height="42" rx="11.67" fill="#d98a1c" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#d98a1c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3"/></g></g><text x="494.67" y="65" font-size="17" font-weight="700" fill="#1d1f23">Picks model and effort</text><text x="438.67" y="112" font-size="13.5" fill="#5f636b">On a new chat's first prompt, and the</text><text x="438.67" y="133" font-size="13.5" fill="#5f636b">effort on every later one.</text><rect x="809.33" y="14" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(833.33 38)"><rect width="42" height="42" rx="11.67" fill="#1fa37a" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#1fa37a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-3.5-3.5M19 15H5l3.5 3.5"/></g></g><text x="889.33" y="65" font-size="17" font-weight="700" fill="#1d1f23">Never breaks your cache</text><text x="833.33" y="112" font-size="13.5" fill="#5f636b">No model switch mid-chat. Another model</text><text x="833.33" y="133" font-size="13.5" fill="#5f636b">runs as a subagent instead.</text><rect x="20" y="184" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(44 208)"><rect width="42" height="42" rx="11.67" fill="#d97757" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9.5h16M12 12.5v4M10 14.5h4"/></g></g><text x="100" y="235" font-size="17" font-weight="700" fill="#1d1f23">Watches the context</text><text x="44" y="282" font-size="13.5" fill="#5f636b">Past the share you choose, new work</text><text x="44" y="303" font-size="13.5" fill="#5f636b">goes to a fresh session.</text><rect x="414.67" y="184" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(438.67 208)"><rect width="42" height="42" rx="11.67" fill="#1fa37a" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#1fa37a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/></g></g><text x="494.67" y="235" font-size="17" font-weight="700" fill="#1d1f23">Shows what it saved</text><text x="438.67" y="282" font-size="13.5" fill="#5f636b">In dollars, per day and month, against</text><text x="438.67" y="303" font-size="13.5" fill="#5f636b">keeping each chat's first model.</text><rect x="809.33" y="184" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(833.33 208)"><rect width="42" height="42" rx="11.67" fill="#d98a1c" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#d98a1c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></g></g><text x="889.33" y="235" font-size="17" font-weight="700" fill="#1d1f23">Cache countdown</text><text x="833.33" y="282" font-size="13.5" fill="#5f636b">How long the cache stays warm, and what</text><text x="833.33" y="303" font-size="13.5" fill="#5f636b">the next message costs warm or cold.</text><rect x="20" y="354" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(44 378)"><rect width="42" height="42" rx="11.67" fill="#6d5ce8" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#6d5ce8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M14.5 5v14"/></g></g><text x="100" y="405" font-size="17" font-weight="700" fill="#1d1f23">A pane beside the chat</text><text x="44" y="452" font-size="13.5" fill="#5f636b">Every number and every setting,</text><text x="44" y="473" font-size="13.5" fill="#5f636b">so you rarely open a config file.</text><rect x="414.67" y="354" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(438.67 378)"><rect width="42" height="42" rx="11.67" fill="#d97757" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l1.8 4.6 4.7 1.4-4.7 1.6L11 16l-1.8-4.4L4.5 10l4.7-1.4z"/><path d="M18 15v5M15.5 17.5h5"/></g></g><text x="494.67" y="405" font-size="17" font-weight="700" fill="#1d1f23">No call for plain replies</text><text x="438.67" y="452" font-size="13.5" fill="#5f636b">yes, ok, option 2, a number or a letter,</text><text x="438.67" y="473" font-size="13.5" fill="#5f636b">in five languages.</text><rect x="809.33" y="354" width="370.67" height="146" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(833.33 378)"><rect width="42" height="42" rx="11.67" fill="#8b7cf6" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#8b7cf6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".9"/></g></g><text x="889.33" y="405" font-size="17" font-weight="700" fill="#1d1f23">Local, with your rules</text><text x="833.33" y="452" font-size="13.5" fill="#5f636b">The log keeps no prompt text. Rules in</text><text x="833.33" y="473" font-size="13.5" fill="#5f636b">plain text, tuned with a live eval.</text>
</g>
</svg>
