<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="gbar" x1="0" x2="1"><stop offset="0" stop-color="#2f8a5f"/><stop offset="1" stop-color="#5cc98f"/></linearGradient>
<linearGradient id="rbar" x1="0" x2="1"><stop offset="0" stop-color="#b53b36"/><stop offset="1" stop-color="#e0834a"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc98f" stop-opacity=".34"/><stop offset="1" stop-color="#5cc98f" stop-opacity="0"/></linearGradient>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101514"/><stop offset="1" stop-color="#17201c"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs><rect x="8" y="8" width="464" height="172" rx="18" fill="#1b1f1d" stroke="#8b7cf0" stroke-width="1.2"/><g transform="translate(28 28)"><rect width="38" height="38" rx="10" fill="#8b7cf0" fill-opacity=".16"/><g transform="translate(7 7)"><circle cx="8" cy="8" r="1.8" fill="none" stroke="#8b7cf0" stroke-width="1.5"/><circle cx="16" cy="16" r="1.8" fill="none" stroke="#8b7cf0" stroke-width="1.5"/><path d="M9.5 9.2c3 1 1 4.6 4.5 5.6" fill="none" stroke="#8b7cf0" stroke-width="1.5" stroke-linecap="round"/></g></g><text x="80" y="44" font-size="14" font-weight="600" fill="#eef2ef" text-anchor="start" >Router</text><text x="80" y="62" font-size="11.5" font-weight="400" fill="#9aa59f" text-anchor="start" >Routing every prompt</text><rect x="24" y="84" width="432" height="80" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 104)"><rect width="34" height="34" rx="10" fill="#8b7cf0" fill-opacity=".16"/><g transform="translate(5 5)"><circle cx="8" cy="8" r="1.8" fill="none" stroke="#8b7cf0" stroke-width="1.5"/><circle cx="16" cy="16" r="1.8" fill="none" stroke="#8b7cf0" stroke-width="1.5"/><path d="M9.5 9.2c3 1 1 4.6 4.5 5.6" fill="none" stroke="#8b7cf0" stroke-width="1.5" stroke-linecap="round"/></g></g><text x="86" y="118" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Router</text><text x="86" y="136" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Picks the cheapest model and effort that</text><text x="86" y="151" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >can handle each prompt.</text><rect x="390" y="104" width="52" height="28" rx="14" fill="#f1f4f2" /><text x="416" y="123" font-size="12.5" font-weight="600" fill="#111" text-anchor="middle" >On</text><rect x="8" y="194" width="464" height="472" rx="18" fill="#1b1f1d" stroke="#5b8def" stroke-width="1.2"/><g transform="translate(28 214)"><rect width="38" height="38" rx="10" fill="#5b8def" fill-opacity=".16"/><g transform="translate(7 7)"><path d="M7 9h10M7 15h10" stroke="#5b8def" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="9" r="1.8" fill="#1b1f1d" stroke="#5b8def" stroke-width="1.5"/><circle cx="10" cy="15" r="1.8" fill="#1b1f1d" stroke="#5b8def" stroke-width="1.5"/></g></g><text x="80" y="230" font-size="14" font-weight="600" fill="#eef2ef" text-anchor="start" >Model &amp; effort</text><text x="80" y="248" font-size="11.5" font-weight="400" fill="#9aa59f" text-anchor="start" >ask · ask · auto · ask</text><rect x="24" y="270" width="432" height="95" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 290)"><rect width="34" height="34" rx="10" fill="#5b8def" fill-opacity=".16"/><g transform="translate(5 5)"><path d="M12 5l1.6 4.4L18 11l-4.4 1.6L12 17l-1.6-4.4L6 11l4.4-1.6z" fill="none" stroke="#5b8def" stroke-width="1.5" stroke-linejoin="round"/></g></g><text x="86" y="304" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Model for a new chat</text><text x="86" y="322" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >On your first prompt, suggests a better</text><text x="86" y="337" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >model. Ask: you confirm. Auto: it just</text><text x="86" y="352" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >switches. Recommended: ask.</text><rect x="372" y="290" width="70" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="384" y="309" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >ask</text><path d="M422 302l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="375" width="432" height="80" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 395)"><rect width="34" height="34" rx="10" fill="#5b8def" fill-opacity=".16"/><g transform="translate(5 5)"><path d="M7 10h9l-2.5-2.5M17 14H8l2.5 2.5" fill="none" stroke="#5b8def" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="86" y="409" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Model mid-chat</text><text x="86" y="427" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >When a later prompt needs a different model,</text><text x="86" y="442" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >offers a subagent. Recommended: ask.</text><rect x="372" y="395" width="70" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="384" y="414" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >ask</text><path d="M422 407l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="465" width="432" height="80" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 485)"><rect width="34" height="34" rx="10" fill="#5b8def" fill-opacity=".16"/><g transform="translate(5 5)"><path d="M6 16.5a7 7 0 1 1 12 0" fill="none" stroke="#5b8def" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13.5l2.6-3.4" stroke="#5b8def" stroke-width="1.6" stroke-linecap="round"/></g></g><text x="86" y="499" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Effort</text><text x="86" y="517" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Raises or lowers the thinking effort to fit</text><text x="86" y="532" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >the prompt. Recommended: ask.</text><rect x="372" y="485" width="70" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="384" y="504" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >auto</text><path d="M422 497l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="555" width="432" height="95" rx="14" fill="#222725" stroke="#323a37" stroke-width="1"/><g transform="translate(38 575)"><rect width="34" height="34" rx="10" fill="#5b8def" fill-opacity=".16"/><g transform="translate(5 5)"><circle cx="9" cy="8" r="1.7" fill="none" stroke="#5b8def" stroke-width="1.5"/><circle cx="9" cy="16" r="1.7" fill="none" stroke="#5b8def" stroke-width="1.5"/><circle cx="15" cy="10" r="1.7" fill="none" stroke="#5b8def" stroke-width="1.5"/><path d="M9 9.7v4.6M15 11.7c0 2-6 1-6 2.6" fill="none" stroke="#5b8def" stroke-width="1.5"/></g></g><text x="86" y="589" font-size="13" font-weight="600" fill="#eef2ef" text-anchor="start" >Subagents</text><text x="86" y="607" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Sends a side task to a cheaper subagent</text><text x="86" y="622" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >instead of switching this chat.</text><text x="86" y="637" font-size="10.8" font-weight="400" fill="#9aa59f" text-anchor="start" >Recommended: ask.</text><rect x="372" y="575" width="70" height="28" rx="9" fill="#2d3431" stroke="#3b4441" stroke-width="1"/><text x="384" y="594" font-size="12.5" font-weight="400" fill="#eef2ef" text-anchor="start" >ask</text><path d="M422 587l4 4 4-4" fill="none" stroke="#9aa59f" stroke-width="1.5" stroke-linecap="round"/></svg>