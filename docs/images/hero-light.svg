<g transform="translate(0 0)">
<defs><clipPath id="heroClip"><rect width="1200" height="440" rx="28"/></clipPath></defs><rect x="0" y="0" width="1200" height="440" rx="28" fill="url(#bg)" stroke="#e6e3f2"/><g clip-path="url(#heroClip)"><circle cx="980" cy="90" r="190" fill="#8b7cf6" fill-opacity="0.16" filter="url(#glow)"/><circle cx="160" cy="430" r="170" fill="#4cc59c" fill-opacity="0.11" filter="url(#glow)"/></g><g transform="translate(60 58)"><rect width="60" height="60" rx="16.67" fill="#6d5ce8" fill-opacity="0.15"/><g transform="translate(10 10) scale(1.67)" fill="none" stroke="#6d5ce8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/></g></g><text x="140" y="102" font-size="44" font-weight="800" fill="#1d1f23" letter-spacing="-.02em">Claude Prompt Router</text><text x="60" y="168" font-size="23" font-weight="500" fill="#1d1f23">The right place, model and effort for every prompt,</text><text x="60" y="200" font-size="23" font-weight="500" fill="#5f636b">decided before the agent starts working.</text><g transform="translate(60 248)"><rect width="42" height="42" rx="11.67" fill="#1fa37a" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#1fa37a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/></g></g><text x="118" y="266" font-size="16" font-weight="700" fill="#1d1f23">Spend less</text><text x="118" y="285" font-size="13.5" fill="#5f636b">a cheaper model and effort whenever one can do the job</text><g transform="translate(60 308)"><rect width="42" height="42" rx="11.67" fill="#6d5ce8" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#6d5ce8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9.5h16M12 12.5v4M10 14.5h4"/></g></g><text x="118" y="326" font-size="16" font-weight="700" fill="#1d1f23">Keep chats lean</text><text x="118" y="345" font-size="13.5" fill="#5f636b">side work goes to a subagent, a new topic to a fresh session</text><g transform="translate(60 368)"><rect width="42" height="42" rx="11.67" fill="#d97757" fill-opacity="0.15"/><g transform="translate(7 7) scale(1.17)" fill="none" stroke="#d97757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="16" cy="12" r="2.6"/></g></g><text x="118" y="386" font-size="16" font-weight="700" fill="#1d1f23">Stay in control</text><text x="118" y="405" font-size="13.5" fill="#5f636b">every change is asked first, unless you choose auto</text><rect x="770" y="46" width="370" height="348" rx="18" fill="#ffffff" stroke="#e6e3f2" filter="url(#sh)"/><g transform="translate(792 68)"><rect width="36" height="36" rx="10" fill="#1fa37a" fill-opacity="0.15"/><g transform="translate(6 6) scale(1)" fill="none" stroke="#1fa37a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/></g></g><text x="840" y="91" font-size="15" font-weight="600" fill="#1d1f23">You saved</text><text x="1118" y="91" font-size="12" fill="#5f636b" text-anchor="end">This month</text><text x="792" y="166" font-size="50" font-weight="800" fill="#1fa37a" letter-spacing="-.02em">$121.85</text><text x="1118" y="152" font-size="14" font-weight="600" fill="#1fa37a" text-anchor="end">22 % less</text><rect x="792" y="184" width="326" height="8" rx="4" fill="#ebe8f5"/><rect x="792" y="184" width="254.28" height="8" rx="4" fill="url(#calm)"/><text x="792" y="224" font-size="12" fill="#5f636b">Without router</text><text x="792" y="243" font-size="15