<svg xmlns="http://www.w3.org/2000/svg" width="496" height="698" viewBox="0 0 496 698" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
<defs>
<filter id="sh" x="-10%" y="-12%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<linearGradient id="calm" x1="0" x2="1"><stop offset="0" stop-color="#1fa37a"/><stop offset="1" stop-color="#4cc59c"/></linearGradient>
<linearGradient id="near" x1="0" x2="1"><stop offset="0" stop-color="#d98a1c"/><stop offset="1" stop-color="#f0b545"/></linearGradient>
<linearGradient id="over" x1="0" x2="1"><stop offset="0" stop-color="#e0483f"/><stop offset="1" stop-color="#f07f4f"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc59c" stop-opacity=".28"/><stop offset="1" stop-color="#4cc59c" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121219"/><stop offset="1" stop-color="#1b1830"/></linearGradient>
</defs>
<g transform="translate(8 6)">
<rect x="8" y="8" width="464" height="172" rx="18" fill="#17181f" stroke="#2b2c37" filter="url(#sh)"/><g transform="translate(28 28)"><rect width="38" height="38" rx="10.56" fill="#8b7cf6" fill-opacity="0.22"/><g transform="translate(6.33 6.33) scale(1.06)" fill="none" stroke="#8b7cf6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/></g></g><text x="80" y="44" font-size="14" font-weight="600" fill="#f2f3f5">Router</text><text x="80" y="62" font-size="11.5" fill="#a2a6ae">Routing every prompt</text><rect x="24" y="84" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 104)"><rect width="34" height="34" rx="9.44" fill="#8b7cf6" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#8b7cf6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/></g></g><text x="86" y="118" font-size="13" font-weight="600" fill="#f2f3f5">Router</text><text x="86" y="136" font-size="10.8" fill="#a2a6ae">Picks the cheapest model and effort that</text><text x="86" y="151" font-size="10.8" fill="#a2a6ae">can handle each prompt.</text><rect x="390" y="104" width="52" height="28" rx="14" fill="#f2f3f5"/><text x="416" y="123" font-size="12.5" font-weight="600" fill="#111216" text-anchor="middle">On</text><rect x="8" y="194" width="464" height="472" rx="18" fill="#17181f" stroke="#2b2c37" filter="url(#sh)"/><g transform="translate(28 214)"><rect width="38" height="38" rx="10.56" fill="#a99cf9" fill-opacity="0.22"/><g transform="translate(6.33 6.33) scale(1.06)" fill="none" stroke="#a99cf9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h9M18 8h1M5 16h3M12 16h7"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></g></g><text x="80" y="230" font-size="14" font-weight="600" fill="#f2f3f5">Model &amp; effort</text><text x="80" y="248" font-size="11.5" fill="#a2a6ae">ask · ask · auto · ask</text><rect x="24" y="270" width="432" height="95" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 290)"><rect width="34" height="34" rx="9.44" fill="#a99cf9" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#a99cf9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l1.8 4.6 4.7 1.4-4.7 1.6L11 16l-1.8-4.4L4.5 10l4.7-1.4z"/><path d="M18 15v5M15.5 17.5h5"/></g></g><text x="86" y="304" font-size="13" font-weight="600" fill="#f2f3f5">Model for a new chat</text><text x="86" y="322" font-size="10.8" fill="#a2a6ae">On your first prompt, suggests a better</text><text x="86" y="337" font-size="10.8" fill="#a2a6ae">model. Ask: you confirm. Auto: it just</text><text x="86" y="352" font-size="10.8" fill="#a2a6ae">switches. Recommended: ask.</text><rect x="372" y="290" width="70" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="384" y="309" font-size="12.5" fill="#f2f3f5">ask</text><path d="M422 302l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="375" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 395)"><rect width="34" height="34" rx="9.44" fill="#a99cf9" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#a99cf9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-3.5-3.5M19 15H5l3.5 3.5"/></g></g><text x="86" y="409" font-size="13" font-weight="600" fill="#f2f3f5">Model mid-chat</text><text x="86" y="427" font-size="10.8" fill="#a2a6ae">When a later prompt needs a different model,</text><text x="86" y="442" font-size="10.8" fill="#a2a6ae">offers a subagent. Recommended: ask.</text><rect x="372" y="395" width="70" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="384" y="414" font-size="12.5" fill="#f2f3f5">ask</text><path d="M422 407l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="465" width="432" height="80" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 485)"><rect width="34" height="34" rx="9.44" fill="#a99cf9" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#a99cf9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16a8 8 0 1 1 15 0"/><path d="M12 13l3.5-4"/><circle cx="12" cy="13.5" r="1.2"/></g></g><text x="86" y="499" font-size="13" font-weight="600" fill="#f2f3f5">Effort</text><text x="86" y="517" font-size="10.8" fill="#a2a6ae">Raises or lowers the thinking effort to fit</text><text x="86" y="532" font-size="10.8" fill="#a2a6ae">the prompt. Recommended: ask.</text><rect x="372" y="485" width="70" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="384" y="504" font-size="12.5" fill="#f2f3f5">auto</text><path d="M422 497l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="555" width="432" height="95" rx="14" fill="#1e1f28" stroke="#2b2c37"/><g transform="translate(38 575)"><rect width="34" height="34" rx="9.44" fill="#a99cf9" fill-opacity="0.22"/><g transform="translate(5.67 5.67) scale(0.94)" fill="none" stroke="#a99cf9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4.5-6 3.5-10.5 6.8"/></g></g><text x="86" y="589" font-size="13" font-weight="600" fill="#f2f3f5">Subagents</text><text x="86" y="607" font-size="10.8" fill="#a2a6ae">Sends a side task to a cheaper subagent</text><text x="86" y="622" font-size="10.8" fill="#a2a6ae">instead of switching this chat.</text><text x="86" y="637" font-size="10.8" fill="#a2a6ae">Recommended: ask.</text><rect x="372" y="575" width="70" height="28" rx="9" fill="#17181f" stroke="#2b2c37"/><text x="384" y="594" font-size="12.5" fill="#f2f3f5">ask</text><path d="M422 587l4 4 4-4" fill="none" stroke="#a2a6ae" stroke-width="1.5" stroke-linecap="round"/>
</g>
</svg>
